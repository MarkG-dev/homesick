<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slop Score</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--ink:#e7e9ee;--mut:#9aa3b2;--acc:#7c9cff;
        --bad:#ff6b6b;--warn:#ffd166;--good:#3fb27f}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
  header h1{font-size:18px;margin:0}header .tag{color:var(--mut);font-size:13px}
  header a{margin-left:auto;color:var(--acc);text-decoration:none;font-size:13px}
  main{max-width:980px;margin:0 auto;padding:24px;display:grid;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  textarea{width:100%;min-height:180px;background:#0d0f14;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:12px 14px;font:inherit;resize:vertical}
  button{background:var(--acc);color:#0b0d12;border:0;border-radius:8px;padding:10px 16px;font:600 14px/1 inherit;cursor:pointer;margin-top:12px}
  .grid{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
  .score{font-size:64px;font-weight:800;line-height:1;text-align:center}
  .level{text-align:center;color:var(--mut);margin-top:4px;font-size:13px}
  .meter{height:12px;border-radius:999px;background:#0d0f14;border:1px solid var(--line);overflow:hidden}
  .meter>span{display:block;height:100%;border-radius:999px}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .pill{background:#0d0f14;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--mut)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:0 0 12px}
  .marked{background:#0d0f14;border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;line-height:1.7}
  mark.buzz{background:rgba(255,107,107,.22);color:#ffd2d2;border-radius:3px;padding:0 2px}
  mark.neg{background:rgba(255,209,102,.20);color:#ffe6ad;border-radius:3px;padding:0 2px}
  .legend{font-size:12px;color:var(--mut);margin-top:8px}
  .muted{color:var(--mut);font-size:13px}.err{color:#ff8d8d;font-size:13px}
  .hidden{display:none}
</style>
</head>
<body>
<header><h1>Slop Score</h1><span class="tag">how much does this read like generic AI?</span>
  <a href="/">→ Voice Filter</a></header>
<main>
  <section class="panel">
    <textarea id="text" placeholder="Paste any text — an AI draft, your copy, a newsletter… and see how much slop it carries."></textarea>
    <button id="run">Score it</button> <span id="msg" class="muted"></span>
    <div id="err" class="err"></div>
  </section>

  <section id="result" class="panel hidden">
    <div class="grid">
      <div>
        <div id="score" class="score">0</div>
        <div id="level" class="level"></div>
      </div>
      <div>
        <div class="meter"><span id="bar" style="width:0%"></span></div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </section>

  <section id="markpanel" class="panel hidden">
    <h2>Where the slop is</h2>
    <div id="marked" class="marked"></div>
    <div class="legend"><mark class="buzz">cliché / buzzword</mark> &nbsp;
      <mark class="neg">"not X, but Y" antithesis</mark></div>
  </section>
</main>
<script>
const $=(i)=>document.getElementById(i);
function color(s){return s>=60?'#ff6b6b':s>=25?'#ffd166':'#3fb27f';}
$("run").onclick=async()=>{
  $("err").textContent="";$("msg").textContent="scoring…";
  try{
    const r=await fetch("/api/slop",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:$("text").value})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||"failed");
    $("score").textContent=j.score; $("score").style.color=color(j.score);
    $("level").textContent=j.level+" · "+j.markers_per_1k+" markers / 1k words";
    $("bar").style.width=j.score+"%"; $("bar").style.background=color(j.score);
    $("stats").innerHTML=[
      ["cliché / buzzword",j.counts["cliche/buzzword"]],
      ["“not X, but Y”",j.counts["negation-antithesis"]],
      ["em-dashes/1k",j.punctuation.em_dashes_per_1k],
      ["avg sentence",j.punctuation.avg_sentence_length+"w"],
      ["words",j.words],
    ].map(([k,v])=>`<span class="pill">${k}: <b style="color:var(--ink)">${v}</b></span>`).join("");
    $("marked").innerHTML=j.highlighted_html;
    $("result").classList.remove("hidden");$("markpanel").classList.remove("hidden");
    $("msg").textContent="";
  }catch(e){$("err").textContent=e.message;$("msg").textContent="";}
};
</script>
</body>
</html>
